<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">

      <title>USP Motorsports - Complete Layout</title>
      <link rel="stylesheet" href="https://use.typekit.net/fcd0awa.css">
      <link rel="stylesheet" href="https://use.typekit.net/xde5rsw.css">

      <link rel="stylesheet" href="https://use.typekit.net/mcw2mcb.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  </head>
   <body>
      <div id="header"></div>
      <div class="page-content ">
        <section class="error-section">
            <div class="container"> 
                 <!-- Title -->
                <h4 class="section-title"> Uh oh! Looks like you're lost</h4>
                <!-- Description -->
                <div class="mb-5 d-block mx-auto" style="max-width: 550px;">
                    <p><strong class="d-block ">
                    Sorry the page you are looking for cannot be found or is no longer available.
                    </strong>
                    <span>It seems like you made a wrong turn. Go back to your previous page,  head home or try using our search to find something specific. </span></p>
                </div>
                <!-- Image -->
              <img src="https://www.uspmotorsports.com/error/error.gif" alt="404 Error" class="img-fluid "  loading="lazy"  />
               <!-- Buttons -->
              <div class="d-flex flex-column flex-lg-row gap-4 mt-mobile-16 w-100 justify-content-center align-items-center px-lg-0 px-4 ">
                 <a href="/" class="btn btn-dark primary-btn"> Return Home </a>
                   <button  type="button" onclick="history.back()" class="btn btn-dark primary-btn" >
                    Go Back
                  </button>

               </div>
            </div>
        </section>

      </div>
       <div id="footer"></div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
      <script src="assets/js/custom.js"></script>
   </body>
